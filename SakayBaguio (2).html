<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakay Baguio</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Satisfy&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3B1F1A;
    --brown: #6B3228;
    --tan: #C4956A;
    --tan-light: #D4A97A;
    --tan-pale: #E8CBA0;
    --cream: #F5ECD8;
    --white: #FFFFFF;
    --text-dark: #2A1208;
    --nav-h: 68px;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--dark); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 400;
    height: var(--nav-h); background: var(--dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .nav-brand {
    display: flex; align-items: flex-end; gap: 0; line-height: 1;
  }
  .brand-main {
    font-family: 'Satisfy', cursive;
    font-size: 32px; color: var(--cream); line-height: 1;
  }
  .brand-top {
    display: flex; flex-direction: column; align-items: flex-start; margin-left: -4px;
  }
  .brand-baguio {
    font-family: 'Dancing Script', cursive;
    font-size: 13px; color: #6DBF5E; line-height: 1; margin-bottom: -2px;
  }
  .nav-links { display: flex; gap: 8px; list-style: none; }
  .nav-links li a {
    display: flex; align-items: center; gap: 6px;
    background: rgba(196,149,106,0.18);
    border: 1.5px solid rgba(196,149,106,0.35);
    color: var(--cream);
    text-decoration: none; font-size: 13.5px; font-weight: 600;
    padding: 8px 18px; border-radius: 50px;
    transition: all 0.2s; cursor: pointer;
  }
  .nav-links li a:hover, .nav-links li a.active {
    background: var(--tan); border-color: var(--tan); color: var(--white);
  }
  .nav-links li a svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* PAGES */
  main { padding-top: var(--nav-h); }
  .page { display: none; }
  .page.active { display: block; }

  /* ===== HOME ===== */
  #home {
    min-height: 100vh;
    position: relative; overflow: hidden;
  }
.home-bg {
  position: absolute; 
  inset: 0;
  background: url('1-12.jpg') center/cover no-repeat;
  opacity: 0.3; 
}
  .home-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(30,10,5,0.15) 0%, rgba(30,10,5,0.25) 60%, rgba(30,10,5,0.5) 100%);
  }
  .home-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    text-align: center; padding: 40px 20px;
  }
  .hero-eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: var(--tan-pale);
    margin-bottom: 12px;
  }
  .hero-ride {
    font-size: 28px; font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: var(--tan-pale);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .hero-through {
    font-size: 22px; font-weight: 600; letter-spacing: 4px;
    text-transform: uppercase; color: var(--tan-pale);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .hero-city {
    font-family: 'Dancing Script', cursive;
    font-size: 100px; color: var(--white); line-height: 1;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6), 0 0 80px rgba(0,0,0,0.3);
    margin-bottom: 40px;
  }
  .btn-view-trips {
    background: var(--tan-pale);
    color: var(--text-dark);
    border: none; border-radius: 50px;
    padding: 16px 44px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .btn-view-trips:hover {
    background: var(--white); transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  /* ===== TRIPS ===== */
  #trips-page {
    position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
  }
  #trips-page.active { display: block; }

  /* Full-screen map covering entire viewport */
  .trips-map-bg {
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 0;
    background: var(--dark-brown);
  }
  .trips-map-bg iframe {
    width: 100%; height: 100%; border: none; opacity: 0.7;
    filter: sepia(30%) saturate(0.8);
  }

  /* Overlay container on top of map */
  .trips-overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center;
    padding-top: calc(var(--nav-h) + 32px);
    pointer-events: none;
  }
  .trips-overlay > * { pointer-events: auto; }
  .trips-heading {
    text-align: center; margin-bottom: 20px;
  }
  .trips-heading h2 {
    font-family: 'Dancing Script', cursive;
    font-size: 34px; color: var(--tan-pale);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .trips-heading p {
    font-size: 14px; color: rgba(245,236,216,0.7);
    margin-top: 4px;
  }
  .trips-grid {
    display: flex; flex-direction: column; gap: 0;
    background: rgba(50, 22, 14, 0.92);
    border-radius: 16px;
    width: 300px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  /* Centered route-list card (default view) */
  #trips-list-card {
    position: absolute; z-index: 10;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(50, 22, 14, 0.92);
    border-radius: 16px;
    padding: 28px 0 10px;
    width: 300px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    transition: all 0.35s ease;
  }
  #trips-list-card.hidden { display: none; opacity: 0; pointer-events: none; transform: translate(-50%, -52%); }
  .trips-list-title {
    font-family: 'Dancing Script', cursive;
    font-size: 26px; color: var(--tan-pale);
    text-align: center; margin-bottom: 16px;
    padding: 0 24px;
  }
  .route-row-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px;
    cursor: pointer;
    border-top: 1px solid rgba(255,255,255,0.08);
    transition: background 0.15s;
    color: var(--tan-pale);
    font-size: 15px; font-weight: 500;
  }
  .route-row-btn:hover { background: rgba(196,149,106,0.2); }
  .route-row-arrow { font-size: 12px; opacity: 0.6; }

  /* Left sidebar detail panel */
  #detail-panel {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 400px; z-index: 10;
    background: var(--white);
    box-shadow: 4px 0 30px rgba(0,0,0,0.25);
    overflow-y: auto;
    display: none;
    animation: slideInLeft 0.3s ease;
    padding-top: var(--nav-h);
  }
  @keyframes slideInLeft { from{transform:translateX(-100%)} to{transform:translateX(0)} }

  /* Destination image banner at top of sidebar */
  .detail-hero-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    background: var(--tan-pale);
  }
  .detail-hero-img-placeholder {
    width: 100%; height: 200px;
    background: linear-gradient(135deg, var(--tan-pale) 0%, var(--tan) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
  }

  .detail-body { padding: 22px; }
  .detail-title {
    font-size: 18px; font-weight: 700; color: var(--dark);
    margin-bottom: 4px;
  }
  .detail-section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: #999;
    margin: 18px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;
  }
  .detail-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid #f0ede8;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
  .detail-info { flex: 1; }
  .detail-info .di-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail-info .di-val { font-size: 13px; font-weight: 600; color: var(--dark); margin-top: 2px; line-height: 1.4; }
  .fare-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .fare-chip {
    background: var(--cream); border-radius: 50px;
    padding: 4px 12px; font-size: 12px; font-weight: 600; color: var(--dark);
  }
  .btn-back-trips {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 18px 22px 22px;
    background: var(--dark); color: var(--cream);
    border: none; border-radius: 50px;
    padding: 10px 22px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: background 0.2s;
  }
  .btn-back-trips:hover { background: var(--brown); }

  /* ===== SETTINGS ===== */
  #settings-page {
    min-height: calc(100vh - var(--nav-h));
    position: relative; overflow: hidden;
  }
  .settings-bg {
    position: absolute; inset: 0;
  background: url('1-12.jpg') center/cover no-repeat;
  opacity: 0.3; 
  }
  .settings-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(20,5,0,0.45);
  }
  .settings-content {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    padding: 40px 20px;
  }
  .settings-card {
    background: rgba(45,18,12,0.88);
    border-radius: 24px;
    padding: 40px 44px;
    width: 100%; max-width: 600px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.5);
  }
  .settings-row {
    background: rgba(245,236,216,0.12);
    border-radius: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    margin-bottom: 16px;
  }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row-label {
    font-size: 18px; font-weight: 600; color: var(--cream);
  }
  .settings-select-wrap { position: relative; }
  .settings-select {
    appearance: none;
    background: rgba(245,236,216,0.15);
    border: 2px solid rgba(245,236,216,0.5);
    border-radius: 50px;
    padding: 10px 40px 10px 20px;
    font-size: 15px; font-weight: 600; color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer; outline: none;
    transition: border-color 0.2s;
    min-width: 130px;
  }
  .settings-select option { background: var(--dark); color: var(--cream); }
  .settings-select:focus { border-color: var(--tan); }
  .settings-select-arrow {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none; color: var(--cream); font-size: 12px;
  }

  /* ===== SUPPORT ===== */
  #support-page {
    min-height: calc(100vh - var(--nav-h));
    position: relative; overflow: hidden;
  }
  .support-bg {
    position: absolute; inset: 0;
  background: url('1-12.jpg') center/cover no-repeat;
  opacity: 0.3; 
  }
  .support-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(20,5,0,0.45);
  }
  .support-content {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    padding: 40px 20px;
  }
  .support-card {
    background: rgba(45,18,12,0.88);
    border-radius: 24px;
    padding: 36px 44px;
    width: 100%; max-width: 620px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.5);
  }
  .support-field-label {
    font-size: 15px; font-weight: 600; color: var(--tan-pale);
    margin-bottom: 8px; margin-top: 20px; display: block;
  }
  .support-field-label:first-child { margin-top: 0; }
  .support-select-wrap { position: relative; margin-bottom: 4px; }
  .support-input, .support-select, .support-textarea {
    width: 100%;
    background: rgba(245,236,216,0.12);
    border: 2px solid rgba(245,236,216,0.25);
    border-radius: 50px;
    padding: 14px 22px;
    font-size: 15px; color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .support-input::placeholder { color: rgba(245,236,216,0.4); }
  .support-input:focus, .support-select:focus, .support-textarea:focus {
    border-color: var(--tan);
  }
  .support-select {
    appearance: none; cursor: pointer;
    background: rgba(245,236,216,0.12);
  }
  .support-select option { background: var(--dark); color: var(--cream); }
  .support-select-arrow {
    position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none; color: var(--cream); font-size: 14px;
  }
  .support-textarea {
    border-radius: 18px; min-height: 110px;
    resize: vertical; line-height: 1.6;
  }
  .btn-submit {
    display: block; margin: 28px auto 0;
    background: var(--tan-pale); color: var(--text-dark);
    border: none; border-radius: 50px;
    padding: 15px 52px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .btn-submit:hover { background: var(--white); transform: translateY(-1px); }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--dark); color: var(--cream);
    padding: 14px 24px; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    transform: translateY(80px); opacity: 0;
    transition: all 0.4s; z-index: 9999;
    border: 1px solid rgba(196,149,106,0.4);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ===== THEMES ===== */
  body.theme-dark {
    --dark: #0D0D0D; --brown: #1A1A1A; --tan: #A07850;
    --tan-light: #B08860; --tan-pale: #C09870; --cream: #D0C0A8;
    --white: #1C1C1C; --text-dark: #D0C0A8;
  }
  body.theme-dark nav { background: #0D0D0D; }
  body.theme-dark .route-card { background: #1A1A1A; }
  body.theme-dark #detail-panel { background: #1C1C1C; }
  body.theme-dark .detail-body { background: #1C1C1C; color: #D0C0A8; }
  body.theme-dark .detail-title { color: #D0C0A8; }
  body.theme-dark .di-val { color: #C0A880; }
  body.theme-dark .detail-section-label { color: #888; border-color: #333; }
  body.theme-dark .detail-row { border-color: #2A2A2A; }
  body.theme-dark .fare-chip { background: #2A2A2A; color: #C0A880; }

  body.theme-light {
    --dark: #5C3320; --brown: #8B5530; --tan: #C4956A;
    --tan-light: #D4A97A; --tan-pale: #E8CBA0; --cream: #FFFAF3;
    --white: #FFFFFF; --text-dark: #3A2010;
  }
  body.theme-light nav { background: #5C3320; }
  body.theme-light .home-bg::after { background: linear-gradient(to bottom,rgba(200,160,100,0.1) 0%,rgba(180,120,60,0.25) 100%); }
  body.theme-light .settings-bg::after, body.theme-light .support-bg::after { background: rgba(220,180,140,0.35); }
  body.theme-light .settings-card, body.theme-light .support-card { background: rgba(90,45,20,0.82); }
  body.theme-light #detail-panel { background: #FFFAF3; }
  body.theme-light .detail-title { color: #3A2010; }
  body.theme-light .di-val { color: #5C3320; }
  body.theme-light .detail-section-label { color: #9A7050; border-color: #E8CBA0; }
  body.theme-light .detail-row { border-color: #F0E0C8; }
  body.theme-light .fare-chip { background: #F5ECD8; color: #5C3320; }

  @media(max-width:860px){
    .trips-layout { grid-template-columns: 1fr; }
    .trips-map-iframe { min-height: 260px; height: 260px; }
    .trips-cards-col { max-height: absolute; }
    #detail-panel { width: 100%; }
    .hero-city { font-size: 60px; }
    .settings-card, .support-card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="brand-top">
      <span class="brand-baguio">Baguio</span>
    </div>
    <span class="brand-main">Sakay</span>
  </div>
  <ul class="nav-links">
    <li><a onclick="goto('home')" id="nav-home" class="active">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6.5L8 2l6 4.5V14H10v-4H6v4H2V6.5z"/></svg>Home
    </a></li>
    <li><a onclick="goto('trips-page')" id="nav-trips-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="7" r="3"/><path d="M8 1C5.24 1 3 3.24 3 6c0 4 5 9 5 9s5-5 5-9c0-2.76-2.24-5-5-5z"/></svg>Trips
    </a></li>
    <li><a onclick="goto('settings-page')" id="nav-settings-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>Settings
    </a></li>
    <li><a onclick="goto('support-page')" id="nav-support-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 10c0 .55-.45 1-1 1H4l-2 3V3c0-.55.45-1 1-1h10c.55 0 1 .45 1 1v7z"/></svg>Support
    </a></li>
  </ul>
</nav>

<main>

<!-- HOME -->
<div id="home" class="page active">
  <div class="home-bg"></div>
  <div class="home-content">
    <p class="hero-eyebrow">Jeepney Route Guide</p>
    <p class="hero-ride">Ride Smarter</p>
    <p class="hero-through">Through</p>
    <h1 class="hero-city">Baguio</h1>
    <button class="btn-view-trips" onclick="goto('trips-page')">View Jeepney Trips</button>
  </div>
</div>

<!-- TRIPS -->
<div id="trips-page" class="page">
  <div class="trips-map-bg">
    <iframe
      id="trips-map-iframe"
      src="https://www.openstreetmap.org/export/embed.html?bbox=120.5400,16.3600,120.6400,16.4500&layer=mapnik"
      title="Baguio City Map">
    </iframe>
  </div>
  <div class="trips-overlay" id="trips-list-card">
    <div class="trips-heading">
      <h2>Jeepney Routes</h2>
      <p>Select a destination</p>
    </div>
    <div class="trips-grid" id="trips-grid">
      <div class="route-row-btn" onclick="showDetail('trancoville')">
        <span class="route-row-name" data-key="card-trancoville">Trancoville</span>
        <span class="route-row-arrow">›</span>
      </div>
      <div class="route-row-btn" onclick="showDetail('aurora')">
        <span class="route-row-name" data-key="card-aurora">Aurora Hill</span>
        <span class="route-row-arrow">›</span>
      </div>
      <div class="route-row-btn" onclick="showDetail('camp7')">
        <span class="route-row-name" data-key="card-camp7">Camp 7</span>
        <span class="route-row-arrow">›</span>
      </div>
      <div class="route-row-btn" onclick="showDetail('irisan')">
        <span class="route-row-name" data-key="card-irisan">Irisan</span>
        <span class="route-row-arrow">›</span>
      </div>
      <div class="route-row-btn" onclick="showDetail('mines')">
        <span class="route-row-name" data-key="card-mines">Mines View</span>
        <span class="route-row-arrow">›</span>
      </div>
    </div>
  </div>

  <!-- Left sidebar detail -->
  <div id="detail-panel">
    <div id="detail-inner"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-page" class="page">
  <div class="settings-bg"></div>
  <div class="settings-content">
    <div class="settings-card">
      <div class="settings-row">
        <span class="settings-row-label" data-en="Theme" data-tl="Tema">Theme</span>
        <div class="settings-select-wrap">
          <select class="settings-select" id="theme-select" onchange="applyTheme(this.value)">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
          <span class="settings-select-arrow">▾</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" data-en="Language" data-tl="Wika">Language</span>
        <div class="settings-select-wrap">
          <select class="settings-select" id="lang-select" onchange="applyLanguage(this.value)">
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
          </select>
          <span class="settings-select-arrow">▾</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SUPPORT -->
<div id="support-page" class="page">
  <div class="support-bg"></div>
  <div class="support-content">

function goto(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
  // hide detail panel when navigating away
  if (id !== 'trips-page') {
    document.getElementById('detail-panel').style.display = 'none';
    const lc = document.getElementById('trips-list-card');
    if (lc) { lc.style.display = ''; lc.classList.remove('hidden'); }
  }
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
  document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active-card'));
  const lc = document.getElementById('trips-list-card');
  if (lc) { lc.style.display = ''; lc.classList.remove('hidden'); }
  const iframe = document.getElementById('trips-map-iframe');
  if (iframe) iframe.src = 'https://www.openstreetmap.org/export/embed.html?bbox=120.5400,16.3600,120.6400,16.4500&layer=mapnik';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== THEME =====
function applyTheme(val) {
  document.body.classList.remove('theme-dark', 'theme-light');
  if (val === 'dark') document.body.classList.add('theme-dark');
  if (val === 'light') document.body.classList.add('theme-light');
  const labels = { default: 'Default theme applied', dark: 'Dark theme applied', light: 'Light theme applied' };
  showToast(labels[val] || 'Theme updated');
}

let currentLang = 'en';

function applyLanguage(lang) {
  currentLang = lang;
  const t = translations[lang];
  // Nav
  setInnerText('nav-home', t['nav-home-text'], true);
  setInnerText('nav-trips-page', t['nav-trips-text'], true);
  setInnerText('nav-settings-page', t['nav-settings-text'], true);
  setInnerText('nav-support-page', t['nav-support-text'], true);
  // Home
  setText('.hero-eyebrow', t['hero-eyebrow']);
  setText('.hero-ride', t['hero-ride']);
  setText('.hero-through', t['hero-through']);
  setText('.btn-view-trips', t['btn-view-trips']);
  // Route card labels (now route-row-name spans)
  const rowNames = document.querySelectorAll('.route-row-name');
  rowNames.forEach(el => {
    const key = el.getAttribute('data-key');
    if (key && t[key]) el.textContent = t[key];
  });
  // Settings labels (data-* spans)
  document.querySelectorAll('[data-en]').forEach(el => {
    const key = el.getAttribute('data-' + lang);
    if (key) el.textContent = key;
  });
  // Theme select options
  const themeOpts = document.querySelectorAll('#theme-select option');
  const themeKeys = ['opt-default','opt-dark','opt-light'];
  themeOpts.forEach((o,i) => { if(themeKeys[i]) o.textContent = t[themeKeys[i]]; });
  // Support form
  setText('.support-field-label:nth-of-type(1)', t['lbl-error-type']);
  document.querySelector('.support-select').options[0].textContent = t['placeholder-error'];
  document.querySelectorAll('.support-field-label').forEach((el,i) => {
    const keys = ['lbl-error-type','lbl-name','lbl-describe'];
    if(keys[i]) el.textContent = t[keys[i]];
  });
  const nameInput = document.querySelector('.support-input');
  if(nameInput) nameInput.placeholder = t['placeholder-name'];
  const textarea = document.querySelector('.support-textarea');
  if(textarea) textarea.placeholder = t['placeholder-describe'];
  setText('.btn-submit', t['btn-submit']);

  showToast(lang === 'tl' ? 'Wikang Tagalog na' : 'Language set to English');
}

function setText(sel, val) {
  const el = document.querySelector(sel);
  if (el) el.textContent = val;
}

function setInnerText(id, val, isNavLink) {
  const el = document.getElementById(id);
  if (!el) return;
  if (isNavLink) {
    // preserve the svg, replace only the text node
    const svg = el.querySelector('svg');
    el.textContent = val;
    if (svg) el.prepend(svg);
  } else {
    el.textContent = val;
  }
}
