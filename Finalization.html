<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakay Baguio</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Satisfy&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  :root {
    --dark: #3B1F1A;
    --brown: #6B3228;
    --tan: #C4956A;
    --tan-light: #D4A97A;
    --tan-pale: #E8CBA0;
    --cream: #F5ECD8;
    --white: #FFFFFF;
    --text-dark: #2A1208;
    --nav-h: 68px;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--dark); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 400;
    height: var(--nav-h); background: var(--dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .nav-brand {
    display: flex; align-items: flex-end; gap: 0; line-height: 1;
  }
  .brand-main {
    font-family: 'Satisfy', cursive;
    font-size: 32px; color: var(--cream); line-height: 1;
  }
  .brand-top {
    display: flex; flex-direction: column; align-items: flex-start; margin-left: -4px;
  }
  .brand-baguio {
    font-family: 'Dancing Script', cursive;
    font-size: 13px; color: #6DBF5E; line-height: 1; margin-bottom: -2px;
  }
  .nav-links { display: flex; gap: 8px; list-style: none; }
  .nav-links li a {
    display: flex; align-items: center; gap: 6px;
    background: rgba(196,149,106,0.18);
    border: 1.5px solid rgba(196,149,106,0.35);
    color: var(--cream);
    text-decoration: none; font-size: 13.5px; font-weight: 600;
    padding: 8px 18px; border-radius: 50px;
    transition: all 0.2s; cursor: pointer;
  }
  .nav-links li a:hover, .nav-links li a.active {
    background: var(--tan); border-color: var(--tan); color: var(--white);
  }
  .nav-links li a svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* PAGES */
  main { padding-top: var(--nav-h); }
  .page { display: none; }
  .page.active { display: block; }

  /* ===== HOME ===== */
  #home {
    min-height: 100vh;
    position: relative; overflow: hidden;
  }
  .home-bg {
    position: absolute;
    inset: 0;
    background: url('1-12.jpg') center/cover no-repeat;
    opacity: 0.3;
  }
  .home-bg::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(30,10,5,0.15) 0%, rgba(30,10,5,0.25) 60%, rgba(30,10,5,0.5) 100%);
  }
  .home-content {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    text-align: center; padding: 40px 20px;
  }
  .hero-eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: var(--tan-pale);
    margin-bottom: 12px;
  }
  .hero-ride {
    font-size: 28px; font-weight: 700; letter-spacing: 6px;
    text-transform: uppercase; color: var(--tan-pale);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .hero-through {
    font-size: 22px; font-weight: 600; letter-spacing: 4px;
    text-transform: uppercase; color: var(--tan-pale);
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .hero-city {
    font-family: 'Dancing Script', cursive;
    font-size: 100px; color: var(--white); line-height: 1;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6), 0 0 80px rgba(0,0,0,0.3);
    margin-bottom: 40px;
  }
  .btn-view-trips {
    background: var(--tan-pale);
    color: var(--text-dark);
    border: none; border-radius: 50px;
    padding: 16px 44px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .btn-view-trips:hover {
    background: var(--white); transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }

  /* ===== TRIPS ===== */
  #trips-page {
    position: fixed; inset: 0; z-index: 1; display: none;
  }
  #trips-page.active { display: block; }

  /* Full-screen map */
  #trips-map {
    position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0; z-index: 1;
  }

  /* Sidebar */
  .trips-sidebar {
    position: fixed; top: calc(var(--nav-h) + 32px); left: 40px; width: 330px;
    background: rgba(45,18,12,.93); border-radius: 24px;
    overflow: hidden; z-index: 500;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .trips-sidebar-header {
    padding: 24px; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .trips-sidebar-header h2 {
    color: var(--tan-pale); font-family: 'Dancing Script', cursive; font-size: 34px;
  }
  .trips-sidebar-header p { color: rgba(255,255,255,.6); margin-top: 4px; }
  .trips-route-btn {
    padding: 18px 24px; display: flex; justify-content: space-between;
    align-items: center; color: var(--cream); cursor: pointer;
    transition: .2s; border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .trips-route-btn:hover { background: rgba(255,255,255,.08); }
  .trips-route-btn.active { background: var(--tan); }
  .trips-route-name { font-weight: 600; }
  .trips-route-arrow { opacity: .6; }
  .trips-loading-bar {
    padding: 18px 24px; text-align: center;
    color: rgba(255,255,255,.5); font-size: 14px; display: none;
  }

  /* Info card */
  .trips-info-card {
    position: fixed; right: 40px; top: calc(var(--nav-h) + 32px); width: 360px;
    background: white; border-radius: 24px; overflow-y: auto;
    max-height: calc(100vh - var(--nav-h) - 48px);
    z-index: 500; display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .trips-info-image { width: 100%; height: 220px; object-fit: cover; }
  .trips-info-content { padding: 24px; }
  .trips-info-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #3B1F1A; }
  .trips-info-row { margin-bottom: 14px; }
  .trips-info-label { font-size: 12px; color: #999; text-transform: uppercase; margin-bottom: 3px; }
  .trips-info-value { font-weight: 600; color: #3B1F1A; }
  .trips-fares { display: flex; gap: 8px; flex-wrap: wrap; }
  .trips-fare-chip { background: #F5ECD8; padding: 6px 12px; border-radius: 30px; font-size: 13px; font-weight: 700; }
  .trips-close-btn {
    margin-top: 18px; width: 100%; border: none;
    background: var(--dark); color: white; padding: 14px;
    border-radius: 50px; cursor: pointer; font-weight: 700;
    font-family: 'Source Sans 3', sans-serif;
  }

  @media(max-width:900px){
    .trips-sidebar { left: 10px; right: 10px; width: auto; }
    .trips-info-card { left: 10px; right: 10px; width: auto; top: auto; bottom: 20px; }
  }

  /* ===== SETTINGS ===== */
  #settings-page {
    min-height: calc(100vh - var(--nav-h));
    position: relative; overflow: hidden;
  }
  .settings-bg {
    position: absolute; inset: 0;
    background: url('1-12.jpg') center/cover no-repeat;
    opacity: 0.3;
  }
  .settings-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(20,5,0,0.45);
  }
  .settings-content {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    padding: 40px 20px;
  }
  .settings-card {
    background: rgba(45,18,12,0.88);
    border-radius: 24px;
    padding: 40px 44px;
    width: 100%; max-width: 600px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.5);
  }
  .settings-row {
    background: rgba(245,236,216,0.12);
    border-radius: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    margin-bottom: 16px;
  }
  .settings-row:last-child { margin-bottom: 0; }
  .settings-row-label {
    font-size: 18px; font-weight: 600; color: var(--cream);
  }
  .settings-select-wrap { position: relative; }
  .settings-select {
    appearance: none;
    background: rgba(245,236,216,0.15);
    border: 2px solid rgba(245,236,216,0.5);
    border-radius: 50px;
    padding: 10px 40px 10px 20px;
    font-size: 15px; font-weight: 600; color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer; outline: none;
    transition: border-color 0.2s;
    min-width: 130px;
  }
  .settings-select option { background: var(--dark); color: var(--cream); }
  .settings-select:focus { border-color: var(--tan); }
  .settings-select-arrow {
    position: absolute; right: 14px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none; color: var(--cream); font-size: 12px;
  }

  /* ===== SUPPORT ===== */
  #support-page {
    min-height: calc(100vh - var(--nav-h));
    position: relative; overflow: hidden;
  }
  .support-bg {
    position: absolute; inset: 0;
    background: url('1-12.jpg') center/cover no-repeat;
    opacity: 0.3;
  }
  .support-bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(20,5,0,0.45);
  }
  .support-content {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - var(--nav-h));
    padding: 40px 20px;
  }
  .support-card {
    background: rgba(45,18,12,0.88);
    border-radius: 24px;
    padding: 36px 44px;
    width: 100%; max-width: 620px;
    box-shadow: 0 8px 60px rgba(0,0,0,0.5);
  }
  .support-field-label {
    font-size: 15px; font-weight: 600; color: var(--tan-pale);
    margin-bottom: 8px; margin-top: 20px; display: block;
  }
  .support-field-label:first-child { margin-top: 0; }
  .support-select-wrap { position: relative; margin-bottom: 4px; }
  .support-input, .support-select, .support-textarea {
    width: 100%;
    background: rgba(245,236,216,0.12);
    border: 2px solid rgba(245,236,216,0.25);
    border-radius: 50px;
    padding: 14px 22px;
    font-size: 15px; color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .support-input::placeholder { color: rgba(245,236,216,0.4); }
  .support-input:focus, .support-select:focus, .support-textarea:focus {
    border-color: var(--tan);
  }
  .support-select {
    appearance: none; cursor: pointer;
    background: rgba(245,236,216,0.12);
  }
  .support-select option { background: var(--dark); color: var(--cream); }
  .support-select-arrow {
    position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%);
    pointer-events: none; color: var(--cream); font-size: 14px;
  }
  .support-textarea {
    border-radius: 18px; min-height: 110px;
    resize: vertical; line-height: 1.6;
  }
  .btn-submit {
    display: block; margin: 28px auto 0;
    background: var(--tan-pale); color: var(--text-dark);
    border: none; border-radius: 50px;
    padding: 15px 52px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: 'Source Sans 3', sans-serif;
    transition: all 0.2s; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .btn-submit:hover { background: var(--white); transform: translateY(-1px); }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--dark); color: var(--cream);
    padding: 14px 24px; border-radius: 14px;
    font-size: 14px; font-weight: 600;
    transform: translateY(80px); opacity: 0;
    transition: all 0.4s; z-index: 9999;
    border: 1px solid rgba(196,149,106,0.4);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ===== THEMES ===== */
  body.theme-dark {
    --dark: #0D0D0D; --brown: #1A1A1A; --tan: #A07850;
    --tan-light: #B08860; --tan-pale: #C09870; --cream: #D0C0A8;
    --white: #1C1C1C; --text-dark: #D0C0A8;
  }
  body.theme-dark nav { background: #0D0D0D; }
  body.theme-dark .route-card { background: #1A1A1A; }
  body.theme-dark #detail-panel { background: #1C1C1C; }
  body.theme-dark .detail-body { background: #1C1C1C; color: #D0C0A8; }
  body.theme-dark .detail-title { color: #D0C0A8; }
  body.theme-dark .di-val { color: #C0A880; }
  body.theme-dark .detail-section-label { color: #888; border-color: #333; }
  body.theme-dark .detail-row { border-color: #2A2A2A; }
  body.theme-dark .fare-chip { background: #2A2A2A; color: #C0A880; }

  body.theme-light {
    --dark: #5C3320; --brown: #8B5530; --tan: #C4956A;
    --tan-light: #D4A97A; --tan-pale: #E8CBA0; --cream: #FFFAF3;
    --white: #FFFFFF; --text-dark: #3A2010;
  }
  body.theme-light nav { background: #5C3320; }
  body.theme-light .home-bg::after { background: linear-gradient(to bottom,rgba(200,160,100,0.1) 0%,rgba(180,120,60,0.25) 100%); }
  body.theme-light .settings-bg::after, body.theme-light .support-bg::after { background: rgba(220,180,140,0.35); }
  body.theme-light .settings-card, body.theme-light .support-card { background: rgba(90,45,20,0.82); }
  body.theme-light #detail-panel { background: #FFFAF3; }
  body.theme-light .detail-title { color: #3A2010; }
  body.theme-light .di-val { color: #5C3320; }
  body.theme-light .detail-section-label { color: #9A7050; border-color: #E8CBA0; }
  body.theme-light .detail-row { border-color: #F0E0C8; }
  body.theme-light .fare-chip { background: #F5ECD8; color: #5C3320; }

  @media(max-width:860px){
    #detail-panel { width: 100%; }
    .hero-city { font-size: 60px; }
    .settings-card, .support-card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <div class="brand-top">
      <span class="brand-baguio">Baguio</span>
    </div>
    <span class="brand-main">Sakay</span>
  </div>
  <ul class="nav-links">
    <li><a onclick="goto('home')" id="nav-home" class="active">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6.5L8 2l6 4.5V14H10v-4H6v4H2V6.5z"/></svg>Home
    </a></li>
    <li><a onclick="goto('trips-page')" id="nav-trips-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="7" r="3"/><path d="M8 1C5.24 1 3 3.24 3 6c0 4 5 9 5 9s5-5 5-9c0-2.76-2.24-5-5-5z"/></svg>Trips
    </a></li>
    <li><a onclick="goto('settings-page')" id="nav-settings-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/></svg>Settings
    </a></li>
    <li><a onclick="goto('support-page')" id="nav-support-page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 10c0 .55-.45 1-1 1H4l-2 3V3c0-.55.45-1 1-1h10c.55 0 1 .45 1 1v7z"/></svg>Support
    </a></li>
  </ul>
</nav>

<main>

<!-- HOME -->
<div id="home" class="page active">
  <div class="home-bg"></div>
  <div class="home-content">
    <p class="hero-eyebrow">Jeepney Route Guide</p>
    <p class="hero-ride">Ride Smarter</p>
    <p class="hero-through">Through</p>
    <h1 class="hero-city">Baguio</h1>
    <button class="btn-view-trips" onclick="goto('trips-page')">View Jeepney Trips</button>
  </div>
</div>

<!-- TRIPS -->
<div id="trips-page" class="page">
  <div id="trips-map"></div>

  <div class="trips-sidebar">
    <div class="trips-sidebar-header">
      <h2>Jeepney Routes</h2>
      <p>Select a destination</p>
    </div>
    <div class="trips-route-btn" onclick="showRoute('mines', this)">
      <span class="trips-route-name">Mines View</span>
      <span class="trips-route-arrow">›</span>
    </div>
    <div class="trips-route-btn" onclick="showRoute('trancoville', this)">
      <span class="trips-route-name">Trancoville</span>
      <span class="trips-route-arrow">›</span>
    </div>
    <div class="trips-route-btn" onclick="showRoute('aurora', this)">
      <span class="trips-route-name">Aurora Hill</span>
      <span class="trips-route-arrow">›</span>
    </div>
    <div class="trips-route-btn" onclick="showRoute('camp7', this)">
      <span class="trips-route-name">Camp 7</span>
      <span class="trips-route-arrow">›</span>
    </div>
    <div class="trips-route-btn" onclick="showRoute('irisan', this)">
      <span class="trips-route-name">Irisan</span>
      <span class="trips-route-arrow">›</span>
    </div>
    <div class="trips-loading-bar" id="tripsLoadingBar">⏳ Loading route...</div>
  </div>

  <div class="trips-info-card" id="tripsInfoCard">
    <img class="trips-info-image" id="tripsInfoImage" src="" alt="">
    <div class="trips-info-content">
      <div class="trips-info-title" id="tripsInfoTitle"></div>
      <div class="trips-info-row">
        <div class="trips-info-label">Route</div>
        <div class="trips-info-value" id="tripsInfoRoute"></div>
      </div>
      <div class="trips-info-row">
        <div class="trips-info-label">Fare</div>
        <div class="trips-fares">
          <div class="trips-fare-chip" id="tripsRegularFare"></div>
          <div class="trips-fare-chip" id="tripsStudentFare"></div>
          <div class="trips-fare-chip" id="tripsSeniorFare"></div>
        </div>
      </div>
      <div class="trips-info-row">
        <div class="trips-info-label">Seating Capacity</div>
        <div class="trips-info-value">24 seats</div>
      </div>
      <div class="trips-info-row">
        <div class="trips-info-label">Schedule</div>
        <div class="trips-info-value" id="tripsInfoSchedule"></div>
      </div>
      <button class="trips-close-btn" onclick="closeRoute()">Close Route</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-page" class="page">
  <div class="settings-bg"></div>
  <div class="settings-content">
    <div class="settings-card">
      <div class="settings-row">
        <span class="settings-row-label" data-en="Theme" data-tl="Tema">Theme</span>
        <div class="settings-select-wrap">
          <select class="settings-select" id="theme-select" onchange="applyTheme(this.value)">
            <option value="default">Default</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
          <span class="settings-select-arrow">▾</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-row-label" data-en="Language" data-tl="Wika">Language</span>
        <div class="settings-select-wrap">
          <select class="settings-select" id="lang-select" onchange="applyLanguage(this.value)">
            <option value="en">English</option>
            <option value="tl">Tagalog</option>
          </select>
          <span class="settings-select-arrow">▾</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SUPPORT -->
<div id="support-page" class="page">
  <div class="support-bg"></div>
  <div class="support-content">
    <div class="support-card">
      <label class="support-field-label">Type of Error?</label>
      <div class="support-select-wrap">
        <select class="support-select">
          <option value="" disabled selected>What are you reporting?</option>
          <option>Wrong Route Information</option>
          <option>App Bug / Glitch</option>
          <option>Incorrect Schedule</option>
          <option>Wrong Fare Information</option>
          <option>Other</option>
        </select>
        <span class="support-select-arrow">▾</span>
      </div>
      <label class="support-field-label">Gmail</label>
      <input class="support-input" type="email" placeholder="Enter your Gmail">
      <label class="support-field-label">Describe the issue</label>
      <textarea class="support-textarea" placeholder="Describe what happened..."></textarea>
      <button class="btn-submit" onclick="showToast('✓ Report submitted! Thank you.')">Submit Report</button>
    </div>
  </div>
</div>

</main>
<div class="toast" id="toast"></div>

<script>

// ── TRIPS MAP SETUP ──────────────────────────────────────────────────────────
const tripsMap = L.map('trips-map').setView([16.4123, 120.5960], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(tripsMap);

// ── ROUTE DATA ───────────────────────────────────────────────────────────────
const routes = {
  mines: {

// ── STATE ────────────────────────────────────────────────────────────────────
let currentPolyline = null;
let glowPolyline    = null;
let tripsMarkers    = [];

// ── OSRM fetch ───────────────────────────────────────────────────────────────
async function fetchRoadRoute(waypoints) {
  const coords = waypoints.map(([lat, lng]) => `${lng},${lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coords}?geometries=geojson&overview=full&steps=false`;
  const res  = await fetch(url);
  const data = await res.json();
  if (data.code !== 'Ok') throw new Error('OSRM error: ' + data.code);
  return data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
}

// ── Marker icon ───────────────────────────────────────────────────────────────
function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.4);"></div>`,
    iconSize: [14,14], iconAnchor: [7,7]
  });
}

// ── Clear map ─────────────────────────────────────────────────────────────────
function clearTripsMap() {
  if (currentPolyline) { tripsMap.removeLayer(currentPolyline); currentPolyline = null; }
  if (glowPolyline)    { tripsMap.removeLayer(glowPolyline);    glowPolyline    = null; }
  tripsMarkers.forEach(m => tripsMap.removeLayer(m));
  tripsMarkers = [];
}

// ── Show route ────────────────────────────────────────────────────────────────
async function showRoute(key, btn) {
  const r = routes[key];
  document.querySelectorAll('.trips-route-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tripsLoadingBar').style.display = 'block';
  document.getElementById('tripsInfoCard').style.display   = 'none';
  clearTripsMap();
  try {
    const latlngs = await fetchRoadRoute(r.waypoints);
    glowPolyline = L.polyline(latlngs, { color:'#7FB3FF', weight:14, opacity:0.3 }).addTo(tripsMap);
    currentPolyline = L.polyline(latlngs, { color:'#2F80ED', weight:6, opacity:0.95, lineJoin:'round' }).addTo(tripsMap);
    const startM = L.marker(latlngs[0], { icon: makeIcon('#27AE60') }).addTo(tripsMap).bindPopup('🚌 Jeepney Terminal — Melvin Jones');
    const endM   = L.marker(latlngs[latlngs.length-1], { icon: makeIcon('#E74C3C') }).addTo(tripsMap).bindPopup('📍 ' + r.name);
    tripsMarkers.push(startM, endM);
    tripsMap.fitBounds(currentPolyline.getBounds(), { padding:[60,60] });
    document.getElementById('tripsInfoImage').src           = r.img;
    document.getElementById('tripsInfoTitle').innerText     = r.name;
    document.getElementById('tripsInfoRoute').innerText     = r.route;
    document.getElementById('tripsRegularFare').innerText   = 'Regular ₱' + r.fare.regular;
    document.getElementById('tripsStudentFare').innerText   = 'Student ₱' + r.fare.student;
    document.getElementById('tripsSeniorFare').innerText    = 'Senior ₱'  + r.fare.senior;
    document.getElementById('tripsInfoSchedule').innerText  = r.firstTrip + ' – ' + r.lastTrip;
    document.getElementById('tripsInfoCard').style.display  = 'block';
  } catch(err) {
    console.error('Route fetch failed:', err);
    alert('Could not load road route. Check your internet connection.');
  } finally {
    document.getElementById('tripsLoadingBar').style.display = 'none';
  }
}

// ── Close route ───────────────────────────────────────────────────────────────
function closeRoute() {
  clearTripsMap();
  document.getElementById('tripsInfoCard').style.display = 'none';
  document.querySelectorAll('.trips-route-btn').forEach(b => b.classList.remove('active'));
  tripsMap.setView([16.4123, 120.5960], 14);
}

function goto(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'trips-page') {
    setTimeout(() => tripsMap.invalidateSize(), 100);
  }
}


function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== THEME =====
function applyTheme(val) {
  document.body.classList.remove('theme-dark', 'theme-light');
  if (val === 'dark') document.body.classList.add('theme-dark');
  if (val === 'light') document.body.classList.add('theme-light');
  const labels = { default: 'Default theme applied', dark: 'Dark theme applied', light: 'Light theme applied' };
  showToast(labels[val] || 'Theme updated');
}

let currentLang = 'en';

function applyLanguage(lang) {
  currentLang = lang;
  const t = translations[lang];
  setInnerText('nav-home', t['nav-home-text'], true);
  setInnerText('nav-trips-page', t['nav-trips-text'], true);
  setInnerText('nav-settings-page', t['nav-settings-text'], true);
  setInnerText('nav-support-page', t['nav-support-text'], true);
  setText('.hero-eyebrow', t['hero-eyebrow']);
  setText('.hero-ride', t['hero-ride']);
  setText('.hero-through', t['hero-through']);
  setText('.btn-view-trips', t['btn-view-trips']);
  const rowNames = document.querySelectorAll('.route-row-name');
  rowNames.forEach(el => {
    const key = el.getAttribute('data-key');
    if (key && t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('[data-en]').forEach(el => {
    const key = el.getAttribute('data-' + lang);
    if (key) el.textContent = key;
  });
  const themeOpts = document.querySelectorAll('#theme-select option');
  const themeKeys = ['opt-default','opt-dark','opt-light'];
  themeOpts.forEach((o,i) => { if(themeKeys[i]) o.textContent = t[themeKeys[i]]; });
  setText('.support-field-label:nth-of-type(1)', t['lbl-error-type']);
  document.querySelector('.support-select').options[0].textContent = t['placeholder-error'];
  document.querySelectorAll('.support-field-label').forEach((el,i) => {
    const keys = ['lbl-error-type','lbl-name','lbl-describe'];
    if(keys[i]) el.textContent = t[keys[i]];
  });
  const nameInput = document.querySelector('.support-input');
  if(nameInput) nameInput.placeholder = t['placeholder-name'];
  const textarea = document.querySelector('.support-textarea');
  if(textarea) textarea.placeholder = t['placeholder-describe'];
  setText('.btn-submit', t['btn-submit']);
  showToast(lang === 'tl' ? 'Wikang Tagalog na' : 'Language set to English');
}

function setText(sel, val) {
  const el = document.querySelector(sel);
  if (el) el.textContent = val;
}

function setInnerText(id, val, isNavLink) {
  const el = document.getElementById(id);
  if (!el) return;
  if (isNavLink) {
    const svg = el.querySelector('svg');
    el.textContent = val;
    if (svg) el.prepend(svg);
  } else {
    el.textContent = val;
  }
}
